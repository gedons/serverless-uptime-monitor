name: Frontend CI Validation

on:
  push:
    branches:
      - master
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  validate-and-build:
    name: Validate & Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Nuxt Application
        run: npm run build
        working-directory: frontend
        env:
          NUXT_PUBLIC_API_BASE: https://zwbk3hscmh.execute-api.eu-west-1.amazonaws.com/Prod
          NUXT_PUBLIC_AWS_REGION: eu-west-1
          NUXT_PUBLIC_COGNITO_USER_POOL_ID: eu-west-1_6n4TmoNJP
          NUXT_PUBLIC_COGNITO_CLIENT_ID: 744in2go42gdb136r1hm90tqs9
